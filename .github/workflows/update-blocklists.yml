# This is a basic workflow to help you get started with Actions

name: update-blocklists

# Controls when the workflow will run
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:


    
jobs:
  update-blocklists:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21
      - run: npm i -g @adguard/hostlist-compiler
      # - name: Checkout Repo
      #   uses: actions/checkout@v6
      - name: Update Blocklists
        shell: pwsh
        run: |
          hostlist-compiler -c config.json -o ScamJamCombined.txt
      - uses: ryand56/r2-upload-action@latest # Can be any release
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./
          destination-dir: ./ # Can be anything as long as it is an actual path
          output-file-url: false # defaults to true
          keep-file-fresh: true # defaults to false

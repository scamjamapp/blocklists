# This is a basic workflow to help you get started with Actions

name: update-remoteaccess

# Controls when the workflow will run
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:


    
jobs:
  update-blocklists:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Update Remote Access Blocklist
        shell: pwsh
        run: |

          $InvalidLolDomains = @("px-*.getscreen.me",
          "agents*-cloud.acronis.com",
          "asapi*.aweray.net",
          "rescue-list.*.logmein-gateway.com",
          "auth*.aeroadmin.com",
          "pdqinstallers.*.r2.cloudflarestorage.com",
          "plus*.site24x7.com",
          "plus*.site24x7.eu",
          "plus*.site24x7.in",
          "plus*.site24x7.cn",
          "plus*.site24x7.net.au",
          "*.-dms.zoho.com.cn",
          "upload_data.qq.com",
          "_v2-origintunneld._tcp.argotunnel.com")

          $Domains = @()

          mkdir lists
          cd lists

          $Request = Invoke-WebRequest https://lolrmm.io/api/rmm_tools.json
          $Data = ConvertFrom-Json $Request
          foreach ($Item in $Data)
          {
              if ($Item.Artifacts.Network.Count -gt 0)
              {
                  foreach ($Domain in $Item.Artifacts.Network[0].Domains)
                  {

                      $Domains += $Domain

                  }
              } else 
              {
                  continue
              }
          }

          if (Test-Path ./scamjam-remoteaccess.txt -PathType Any)
          {
            Remove-Item ./scamjam-remoteaccess.txt -Force
          }

          foreach ($Domain in $Domains)
          {

              if ($Domain -eq "user_managed")
              {
                  continue
              } elseif ($Domain -eq "<operator-configured Vector Discovery Server URL>")
              {
                  continue
              } elseif ($Domain -in $InvalidLolDomains){
                continue
              }

              try { #my name is tanka jahari but i would NEVER use exceptions for control flow
                  [ipaddress]$IP = $Domain
                  continue
              } catch {
                  Add-Content -Path ./scamjam-remoteaccess.txt -Value $Domain
              }
  
          }
          cd ../
      - uses: ryand56/r2-upload-action@latest # Can be any release
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./lists
          output-file-url: false # defaults to true
          keep-file-fresh: true # defaults to false

# This is a basic workflow to help you get started with Actions

name: update-nrd

# Controls when the workflow will run
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:


    
jobs:
  update-nrd:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Update Newly Registered Domains Blocklist
        shell: bash
        run: |
         DAY_RANGE=14

          mkdir Temp
          cd Temp

          wget https://cdn.jsdelivr.net/gh/PeterDaveHello/nrd-list-downloader@master/nrd-list-downloader.sh
          chmod +x nrd-list-downloader.sh
          ./nrd-list-downloader.sh

          cd ../

      - uses: ryand56/r2-upload-action@latest # Can be any release
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./Temp
          output-file-url: false # defaults to true
          keep-file-fresh: true # defaults to false
